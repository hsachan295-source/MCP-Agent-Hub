[project]
name = "mcp-agent-hub"
version = "0.1.0"
description = "A beginner-friendly Python implementation of the Model Context Protocol (MCP): server, client, tools, resources, prompts and STDIO transport."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The official MCP Python SDK. Version 2 renamed FastMCP to MCPServer, which this project uses.
    "mcp>=2.2.0,<3",
]

# Test tools for pip users:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

# The same test tools for uv users: `uv sync` installs this group automatically.
# (Keep both lists identical.)
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import mcp_agent_hub even if the project is not installed.
pythonpath = ["src"]
# "auto" runs every `async def test_...` without needing a decorator.
asyncio_mode = "auto"
